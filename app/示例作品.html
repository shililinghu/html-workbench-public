<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的第一个页面</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#eeedf2;color:#252332;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;background:white}section{position:relative;padding:var(--pad);background:var(--bg);color:var(--ink);text-align:var(--align);overflow-wrap:anywhere}h1,h2,p{margin:0}h1,h2{font-size:var(--size);line-height:1.22;letter-spacing:-.035em;white-space:pre-wrap}p{font-size:17px;line-height:1.85;white-space:pre-wrap;opacity:.78;margin-top:20px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.2em;margin-bottom:26px;white-space:pre-wrap}.hero{min-height:380px;display:flex;flex-direction:column;justify-content:center}.hero h1{max-width:850px}.cards-grid{display:grid;grid-template-columns:repeat(var(--columns),minmax(0,1fr));gap:16px;margin-top:30px}.card{border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);border-radius:16px;padding:26px;background:color-mix(in srgb,var(--bg) 94%,var(--ink))}.card h3{font-size:18px;margin:0;white-space:pre-wrap}.card p{font-size:14px;margin-top:12px}.quote h2:before{content:'“';display:block;color:var(--accent);font-size:64px;height:70px}.image-box{margin-top:24px}.image-box img{width:var(--image-width);max-height:700px;object-fit:contain;border-radius:16px}.image-placeholder{padding:70px 20px;background:color-mix(in srgb,var(--bg) 90%,var(--ink));border:1px dashed #aaa3bb;border-radius:16px;text-align:center;opacity:.6;font-size:14px}@media(max-width:600px){section{padding:28px 22px}h1,h2{font-size:min(var(--size),36px)}.cards-grid{grid-template-columns:1fr}.hero{min-height:360px}}body.slides main{max-width:1200px}body.slides section{display:none;min-height:calc(100vh - 70px)}body.slides section.active{display:flex;flex-direction:column;justify-content:center}#nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:#252332;color:#fff;padding:10px 16px;border-radius:30px;box-shadow:0 4px 20px #0002;z-index:10;font:13px system-ui}#nav button{background:#ffffff18;color:inherit;border:0;border-radius:20px;padding:8px 12px;cursor:pointer}body:not(.slides) #prev,body:not(.slides) #next,body:not(.slides) #count{display:none}body.slides{padding-bottom:70px}@media print{#nav{display:none}body.slides section{display:block;break-after:page;min-height:auto}}</style></head><body><main><section class="hero" data-id="b266ee2ph5" style="--bg:#f0edff;--ink:#252332;--accent:#7760dc;--size:48px;--pad:56px;--align:left;--columns:3;--image-width:100%"><div class="eyebrow">IDEA → PAGE</div><h1>让你的想法，成为页面。</h1><p>一个可以亲手打磨的页面。
从文字、图片到布局，每一处都由你决定。</p></section><section class="cards" data-id="bzfkdmqtu8" style="--bg:#ffffff;--ink:#252332;--accent:#7760dc;--size:30px;--pad:56px;--align:left;--columns:3;--image-width:100%"><h2>从想法到作品，只差一次开始</h2><p>用熟悉的方式编辑，让每一处变化都清晰可见。</p><div class="cards-grid"><article class="card"><h3>01 / 直接编辑</h3><p>点击文字就能修改。选中区块，调整颜色、留白和排版。</p></article><article class="card"><h3>02 / 与 AI 一起</h3><p>提出要求，查看修改方案，再把变化应用到你的页面。</p></article><article class="card"><h3>03 / 自由分享</h3><p>导出独立 HTML，打开浏览器，就能看到完整作品。</p></article></div></section><section class="quote" data-id="bplbzl8d36" style="--bg:#252332;--ink:#f9f7ff;--accent:#7760dc;--size:30px;--pad:56px;--align:left;--columns:3;--image-width:100%"><h2>让工具退后，让表达向前。</h2><p>你的第一份作品，从这里开始。</p></section></main><nav id="nav" aria-label="演示控制"><button id="prev">←</button><span id="count"></span><button id="next">→</button><button id="toggle">分页演示</button></nav><script>(()=>{const sections=[...document.querySelectorAll('main>section')];let page=0;const count=document.getElementById('count');function show(){sections.forEach((s,i)=>s.classList.toggle('active',i===page));count.textContent=sections.length?(page+1)+' / '+sections.length:'0 / 0';document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page>=sections.length-1;}function move(d){page=Math.max(0,Math.min(sections.length-1,page+d));show();window.scrollTo(0,0);}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);const toggle=document.getElementById('toggle');if(toggle)toggle.onclick=()=>{document.body.classList.toggle('slides');toggle.textContent=document.body.classList.contains('slides')?'滚动阅读':'分页演示';show();window.scrollTo(0,0);};document.addEventListener('keydown',e=>{if(document.body.classList.contains('slides')&&['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();move(e.key==='ArrowRight'?1:-1);}});show();})();</script><script id="workbench-project" type="application/json">{"ve
